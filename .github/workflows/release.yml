name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: node scripts/set-version.mjs "${{ github.ref_name }}"

      - name: Generate app icons
        run: npm run tauri icon src-tauri/icons/icon_source.png

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "EclipseDesktopStation ${{ github.ref_name }}"
          releaseBody: |
            ## EclipseDesktopStation ${{ github.ref_name }}

            Desktop practice console for FTC Robot Controllers and Control Hubs.
            Built by FTC Team Eclipse 30618.

            ### Install

            | Platform | File |
            |----------|------|
            | macOS    | `.dmg` |
            | Linux (Debian/Ubuntu) | `.deb` |
            | Linux (Fedora/RHEL)   | `.rpm` |
            | Linux (any distro)    | `.AppImage` (portable, no install) |
            | Windows  | `.msi` or `.exe` |

            > **macOS:** The app is not notarized. On first launch, right-click → **Open**.

            ### What's new
            See the commit history for changes in this release.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
