[package]
name = "eclipse-desktop-station"
version = "0.1.0"
description = "Desktop practice console for FTC Robot Controllers"
authors = ["EclipseDesktopStation contributors"]
edition = "2021"

[lib]
name = "eclipse_desktop_station_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
gilrs = "0.11"
roxmltree = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.0.0", features = [] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
nusb = "0.2"
